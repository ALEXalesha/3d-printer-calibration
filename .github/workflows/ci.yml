# Checks on GitHub (the copy published by tools/publish_github.sh). The home Gitea runs
# .gitea/workflows/ci.yml on the PC runner; keep both in step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies
        run: |
          pip install -r requirements-dev.txt
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: Python tests (Qt offscreen, includes the JS = Python equality law)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: JavaScript core
        run: npm test
      - name: Page in headless Chromium
        run: npx playwright test --workers=1
