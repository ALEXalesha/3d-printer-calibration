# Checks on the home Gitea, on the PC runner (label windows).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The PC's Python 3.13 in its own environment, not setup-python: that one needs
      # admin rights on the registry, which the runner does not have.
      - name: Python environment
        run: |
          py -3.13 -m venv .ci-venv
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$((Resolve-Path .ci-venv).Path)\Scripts`n")

      - name: Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Node dependencies first (the equality law runs node)
        run: npm ci --no-audit --no-fund

      - name: Python tests (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: JavaScript core (node:test)
        run: npm test

      - name: Page in headless Chromium (Playwright, one worker)
        run: npx playwright test --workers=1
# The Electron tests (npm run test:app) stay local: the window is invisible in test mode,
# but the runner shares the PC with its user and an Electron start there is not needed.
